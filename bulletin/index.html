<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clay County Community Bulletin | Local Events & Dispatches</title>
    
    <meta name="description" content="Official community bulletin for Clay County, Flora, and Louisville, IL. Stay updated on local church events, fundraisers, and town happenings.">
    <meta name="keywords" content="Clay County IL Events, Flora IL Happenings, Louisville IL News, Community Calendar, Support My Local Community">
    <meta property="og:title" content="Clay County Community Bulletin">
    <meta property="og:description" content="Local dispatches and upcoming events for our community.">
    <meta property="og:type" content="website">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H6Q756MVE8"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-H6Q756MVE8', { 'page_title': 'SMLC Bulletin Widget Feed' });
      gtag('config', 'G-L376P3NPY4', { 'page_title': 'Global Watermark Profile' });
    </script>

    <style>
        /* --- CLIPPING AESTHETIC --- */
        .news-clipping-wrapper {
            background-color: #fffdf5; /* Aged Paper Tint */
            box-shadow: 6px 6px 0px rgba(0,0,0,0.6); 
            border: 1px solid #222;
            font-family: 'Times New Roman', Times, serif;
            color: #222;
            max-width: 500px;
            margin: 20px auto;
            overflow: hidden;
            /* --- DIVI SETTINGS: Section Height 50 --- */
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .clipping-masthead {
            text-align: center;
            padding: 0 10px;
            border-bottom: 4px double #222; 
            /* --- DIVI SETTINGS: Row Height 30 --- */
            margin: 0 30px; 
            padding-bottom: 20px;
        }

        .black-tag {
            background: #000;
            color: #fff;
            text-transform: uppercase;
            /* --- DIVI SETTINGS: Header Text Size 30 --- */
            font-size: 30px;
            font-weight: bold;
            padding: 5px 15px;
            display: inline-block;
            letter-spacing: 1px;
            line-height: 1;
        }

        .clipping-tagline {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            margin: 10px 0 0 0;
            letter-spacing: 1px;
            color: #444;
        }

        #divi-event-list {
            /* --- DIVI SETTINGS: Row Height 30 --- */
            padding: 10px 30px; 
        }

        .divi-event-item {
            border-bottom: 1px dashed #777;
            padding: 15px 0;
            text-align: left;
        }

        .divi-event-item:last-child {
            border-bottom: none;
        }

        .divi-event-date {
            color: #cc0000;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }

        .divi-event-title {
            font-size: 20px; 
            font-weight: bold;
            margin: 5px 0;
            line-height: 1.2;
        }

        /* --- DIVI SETTINGS: Body Text Size 14 --- */
        .event-info-text {
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        /* --- ONGOING "RIGHT NOW" INDICATOR --- */
        .right-now-badge {
            display: inline-block;
            background-color: #cc0000;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 8px;
            vertical-align: middle;
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .event-snippet {
            font-size: 13px;
            color: #555;
            font-style: italic;
            margin: 8px 0;
            line-height: 1.4;
            display: block;
        }

        .full-details {
            display: none;
            font-size: 13px;
            color: #222;
            font-style: normal;
            margin: 10px 0;
            line-height: 1.5;
            background: rgba(0,0,0,0.03);
            padding: 10px;
            border-left: 3px solid #cc0000;
        }

        .read-more-btn {
            color: #cc0000;
            text-decoration: underline;
            font-weight: bold;
            font-style: normal;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            display: inline-block;
            margin-top: 5px;
        }

        /* --- CALENDAR LINKS --- */
        .cal-links { 
            margin-top: 15px;
            font-size: 12px;
        }

        .cal-label {
            display: block;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: bold;
            color: #666;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .cal-text-link {
            color: #cc0000 !important;
            text-decoration: none !important;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
        }
        
        .cal-text-link:hover { text-decoration: underline !important; }

        .clipping-footer {
            border-top: 1px solid #222;
            padding: 15px;
            text-align: center;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 10px;
        }

        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #cc0000;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .news-clipping-wrapper { width: 95%; margin: 10px auto; }
            .black-tag { font-size: 24px; } 
        }
    </style>
</head>
<body>

<div class="news-clipping-wrapper">
    <div class="clipping-masthead">
        <span class="black-tag">Community Bulletin</span>
        <p class="clipping-tagline" id="month-tagline">Dispatches & Happenings</p>
    </div>
    
    <div id="divi-event-list">
        <p style="text-align:center; font-style: italic; padding: 20px;">
            <span class="loader"></span> Connecting to the wire...
        </p>
    </div>
    
    <div class="clipping-footer">
        <a href="https://supportmylocalcommunity.com" id="footer-main-link" target="main-content-window" style="color: inherit; text-decoration: none; display: block;">
            View Full Community Calendar & Details<br>
            Support My Local Community
        </a>
    </div>
</div>

<script type="application/ld+json" id="structured-data-block"></script>

<script>
    /**
     * SKELETON ENGINE - SMART CACHE & ANALYTICS ENABLED
     * TIMESTAMP: June 18, 2026 - 6:20 PM EST (New York Time)
     */
    // Live verified Script Authority URL via bulletin-engine.js mapping
    const BULLETIN_URL = "https://script.google.com/macros/s/AKfycbz_nol3WlVM6_8FKN1V2aVeW5jZRa54gWs13lVEHVhx07xpzjMmedBd5vRdVyPiSemopA/exec";

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const currentMonthName = monthNames[new Date().getMonth()];
    document.getElementById('month-tagline').innerText = `${currentMonthName} Dispatches & Happenings`;

    /**
     * UTM Link Generation Matrix
     */
    function generateTrackedUrl(base) {
        try {
            const url = new URL(base);
            url.searchParams.set('utm_source', 'SMLC');
            url.searchParams.set('utm_medium', 'bulletin_widget');
            url.searchParams.set('utm_campaign', 'clay_county_feed');
            return url.toString();
        } catch(e) {
            return base;
        }
    }

    const fl = document.getElementById('footer-main-link');
    if (fl) { fl.href = generateTrackedUrl(fl.href); }

    /**
     * Analytics Event Tracker
     */
    function trackEvent(action, label) {
        if (typeof gtag !== 'undefined') {
            gtag('event', action, {
                'event_category': 'Bulletin Widget',
                'event_label': label,
                'utm_source': 'SMLC'
            });
        }
    }

    function toggleDetails(id, title) {
        const detailEl = document.getElementById('details-' + id);
        const snippetEl = document.getElementById('snippet-' + id);
        const btnEl = document.getElementById('btn-' + id);
        
        if (detailEl.style.display === 'block') {
            detailEl.style.display = 'none';
            snippetEl.style.display = 'block';
            btnEl.innerText = 'Read More';
        } else {
            detailEl.style.display = 'block';
            snippetEl.style.display = 'none';
            btnEl.innerText = 'Show Less';
            trackEvent('read_more_click', title);
        }
    }

    /**
     * Schema microdata engine injection targeting structured-data blocks
     */
    function injectStructuredData(events) {
        const schema = {
            "@context": "https://schema.org",
            "@type": "ItemList",
            "itemListElement": events.map((ev, index) => ({
                "@type": "ListItem",
                "position": index + 1,
                "item": {
                    "@type": "Event",
                    "name": ev.name,
                    "startDate": ev.date,
                    "location": {
                        "@type": "Place",
                        "name": ev.location,
                        "address": {
                            "@type": "PostalAddress",
                            "addressLocality": "Flora",
                            "addressRegion": "IL"
                        }
                    },
                    "description": ev.details
                }
            }))
        };
        document.getElementById('structured-data-block').textContent = JSON.stringify(schema);
    }

    async function displayDiviEvents() {
        const list = document.getElementById('divi-event-list');
        const cacheBuster = `t=${Date.now()}&v=${Math.random().toString(36).substring(7)}`;
        const targetFeedUrl = `${BULLETIN_URL}?feed=true&${cacheBuster}`;

        try {
            const response = await fetch(targetFeedUrl);
            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

            let events = await response.json();

            if (Array.isArray(events) && events.length > 0) {
                list.innerHTML = '';
                
                const now = new Date();
                const thirtyDaysFromNow = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000));
                
                const todayMidnight = new Date();
                todayMidnight.setHours(0, 0, 0, 0);

                events = events.filter(item => {
                    if (item.isRecurring || item.recurring === true) {
                        return true;
                    }

                    if (!item.date) return false;
                    
                    let eventDate = new Date(item.date);
                    if (isNaN(eventDate.getTime())) {
                        eventDate = new Date(item.date.replace(/-/g, "/")); 
                    }
                    if (isNaN(eventDate.getTime())) {
                        return true;
                    }

                    // Checks if item shares the active current text date baseline 
                    const checkToday = new Date(eventDate);
                    checkToday.setHours(0,0,0,0);
                    if (checkToday.getTime() === todayMidnight.getTime()) {
                        return true;
                    }
                    
                    // Temporal execution window parsing range validation matching your specifications
                    return eventDate >= now && eventDate <= thirtyDaysFromNow;
                });

                if (events.length === 0) {
                    list.innerHTML = `<p style='text-align:center; padding: 20px; font-style:italic;'>No active dispatches scheduled at this time.</p>`;
                    return;
                }
                
                injectStructuredData(events);

                events.forEach((item, index) => {
                    const title = item.name || "Untitled Event";
                    
                    // Handle inner calculations corresponding to engine formatting arrays
                    const eventDateObj = new Date(item.date);
                    const displayDate = isNaN(eventDateObj.getTime()) ? (item.date || "Date TBA") : eventDateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                    
                    const displayTime = item.time || "Time TBA";
                    const location = item.location || "Clay County";
                    const details = item.details || "";
                    const isOngoing = item.isOngoing || false;
                    
                    let gCalLink = item.googleLink;
                    if (!gCalLink || gCalLink === "#" || gCalLink.includes("/edit")) {
                        const cleanTitle = encodeURIComponent(title);
                        const cleanLoc = encodeURIComponent(location);
                        const cleanDesc = encodeURIComponent(details);
                        const gDate = isNaN(eventDateObj.getTime()) ? "" : eventDateObj.toISOString().replace(/-|:|\.\d\d\d/g, "").split("T")[0];
                        gCalLink = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${cleanTitle}&dates=${gDate}/${gDate}&details=${cleanDesc}&location=${cleanLoc}&sf=true&output=xml`;
                    }
                    
                    gCalLink = generateTrackedUrl(gCalLink);
                    
                    const icsLink = item.icalData ? "data:text/calendar;base64," + item.icalData : ("data:text/calendar;charset=utf8," + encodeURIComponent(`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${title}\nLOCATION:${location}\nDESCRIPTION:${details || 'Local Event'}\nEND:VEVENT\nEND:VCALENDAR`));
                    
                    const isLong = details.length > 85;
                    const snippetText = isLong ? details.substring(0, 85) + "..." : details;

                    const div = document.createElement('div');
                    div.className = 'divi-event-item';
                    div.innerHTML = `
                        <div class="divi-event-date">${displayDate}</div>
                        <div class="divi-event-title">${title}</div>
                        <div class="event-info-text">
                            <strong>Where:</strong> ${location} <br> 
                            <strong>Time:</strong> ${displayTime} ${isOngoing ? '<span class="right-now-badge">Right Now!</span>' : ''}
                        </div>
                        
                        ${details ? `
                            <div class="event-snippet" id="snippet-${index}">"${snippetText}"</div>
                            <div class="full-details" id="details-${index}">${details}</div>
                            ${isLong ? `<div class="read-more-btn" id="btn-${index}" onclick="toggleDetails(${index}, '${title.replace(/'/g, "\\'")}')">Read More</div>` : ''}
                        ` : ''}

                        <div class="cal-links">
                            <span class="cal-label">Add to Calendar</span>
                            <a href="${gCalLink}" target="main-content-window" class="cal-text-link" onclick="trackEvent('google_cal_add', '${title.replace(/'/g, "\\'")}')">Google</a>
                            <span style="color:#777; margin: 0 5px;">|</span>
                            <a href="${icsLink}" download="event.ics" class="cal-text-link" onclick="trackEvent('apple_cal_add', '${title.replace(/'/g, "\\'")}')">Apple / Outlook</a>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } else {
                list.innerHTML = `<p style='text-align:center; padding: 20px; font-style:italic;'>No more dispatches scheduled for ${currentMonthName}.</p>`;
            }
        } catch (e) {
            console.error("Fetch failure:", e);
            list.innerHTML = `<p style='text-align:center; padding: 20px; color:#cc0000;'>Sync Error. Please check script permissions.</p>`;
        }
    }

    if (document.readyState === 'complete') {
        displayDiviEvents();
    } else {
        window.addEventListener('load', displayDiviEvents);
    }
</script>

</body>
</html>
