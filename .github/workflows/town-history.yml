name: Monthly Town History Update

on:
  schedule:
    # Runs at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  # Allows you to trigger it manually from the "Actions" tab in your repo
  workflow_dispatch: 

jobs:
  update-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit the updated JSON files back to your repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run update script
        run: python town.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Only commit if files have actually changed
          if [ -n "$(git status --porcelain)" ]; then
            git add *.json
            git commit -m "Auto-update: Monthly historical data sync"
            git push
          else
            echo "No changes detected to commit."
          fi
