name: Monthly Town History Update

on:
  schedule:
    # Runs at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: 

jobs:
  update-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Download town.py from repository
        # This downloads the raw file to the current runner workspace
        run: |
          curl -o town.py https://raw.githubusercontent.com/skventuresigns-design/smlc/main/townjson/town.py

      - name: Run update script
        run: python town.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Only commit if files have actually changed
          if [ -n "$(git status --porcelain)" ]; then
            git add *.json
            git commit -m "Auto-update: Monthly historical data sync"
            git push
          else
            echo "No changes detected to commit."
          fi
