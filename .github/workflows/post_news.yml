name: Frequent News Sync

on:
  schedule:
    - cron: '22,44 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Pull Repository Files
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install News Tools
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: 4. Run News Scraper
        run: |
          cd local-news
          python update_news.py

      - name: 5. Save New Stories to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add local-news/news_data.json
          git commit -m "Auto-update news data [skip ci]" || echo "No new stories to save."
          git push
