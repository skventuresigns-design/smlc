name: Frequent News Sync

on:
  schedule:
    - cron: '22,44 * * * *' # Runs at 22 and 44 minutes past every hour
  workflow_dispatch: # Allows you to run it manually for testing

# --- PREVENTS DEPLOYMENT OVERLAP ---
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial: Allows the action to save news_data.json
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: Run News Scraper
        working-directory: ./local-news
        run: python update_news.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # Only add news_data.json to keep the commit clean
          git add local-news/news_data.json
          
          # Only push if there are actual new stories to report
          git commit -m "Auto-update news data" || echo "No new stories found."
          git push
