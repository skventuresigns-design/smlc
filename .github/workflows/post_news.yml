name: Frequent News Sync

on:
  schedule:
    - cron: '22,44 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Pull Repository Files
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install News Tools
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: 4. Find and Run Scraper
        run: |
          # This line hunts down the script wherever it is hiding
          SCRIPT_PATH=$(find . -name "update_news.py" -print -quit)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Error: update_news.py not found!"
            exit 1
          fi
          SCRIPT_DIR=$(dirname "$SCRIPT_PATH")
          echo "Found script in: $SCRIPT_DIR"
          cd "$SCRIPT_DIR"
          python update_news.py

      - name: 5. Save New Stories to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Find the JSON file to make sure we're adding the right path
          JSON_PATH=$(find . -name "news_data.json" -print -quit)
          if [ ! -z "$JSON_PATH" ]; then
            git add "$JSON_PATH"
            git commit -m "Auto-update news data [skip ci]" || echo "No changes to save."
            git push
          else
            echo "news_data.json not found."
          fi
