name: Frequent News Sync

on:
  schedule:
    - cron: '22,44 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 1. Pull Repository Files
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install News Tools
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4

      - name: 4. Debug File Search
        run: |
          echo "--- Listing all files in repo ---"
          find . -maxdepth 3 -not -path '*/.*'
          echo "--- End of list ---"
          
          SCRIPT_PATH=$(find . -name "update_news.py" -print -quit)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "ERROR: The file update_news.py is physically missing from the repo!"
            exit 1
          fi
          cd $(dirname "$SCRIPT_PATH")
          python update_news.py

      - name: 5. Save New Stories to Repo
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # This tells Git to look for changes in the whole project
          git add -A
          
          # Only commit if there is actually something new to say
          git commit -m "Auto-update news data [skip ci]" || echo "No news updates found this time."
          git push
