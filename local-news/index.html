<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clay County News Center</title>
    <style>
        /* This forces the background to be cream so the white box disappears */
        html, body { 
            background-color: #e5e5e5 !important; 
            margin: 0; 
            padding: 0; 
            font-family: 'Times New Roman', serif; 
            height: 100%; 
        }
        
        .news-hub-wrapper { 
            background-color: #e5e5e5; 
            padding: 15px; 
            min-height: 100vh; 
        }

        .newspaper-masthead { border-bottom: 4px double #222; text-align: center; padding: 10px 0; margin-bottom: 20px; }
        .news-title { font-size: 2.5rem; text-transform: uppercase; margin: 0; }
        
        .story-card { background: #fff; padding: 20px; margin-bottom: 15px; border: 1px solid #ccc; box-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        .story-card h2 { margin: 0 0 10px 0; color: #0c0b82; font-size: 1.4rem; }
    </style>
</head>
<body>
    <div class="news-hub-wrapper">
        <div class="newspaper-masthead">
            <h1 class="news-title">Clay County News</h1>
            <p style="font-weight:bold; border-top:1px solid #222; border-bottom:1px solid #222; padding: 5px 0;">
                VOL. 1 — NO. 1 | CLAY COUNTY, IL
            </p>
        </div>

        <div id="full-news-container">
            <p style="text-align:center;">Scanning local reports...</p>
        </div>
    </div>
    <script src="https://www.supportmylocalcommunity.com/local-news/news-engine.js?v=2.0"></script>
</body>
</html>
