<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clay County News Center</title>
    <link rel="stylesheet" href="../style.css"> 
    <style>
        body { background: #fcf6de; margin: 0; padding: 0; font-family: 'Times New Roman', serif; }
        .newspaper-masthead { border-bottom: 4px double #222; margin-bottom: 20px; text-align: center; padding: 10px 0; }
        .news-title { font-size: 3rem; text-transform: uppercase; margin: 0; letter-spacing: -2px; }
        .news-meta-bar { border-top: 1px solid #222; border-bottom: 1px solid #222; display: flex; justify-content: space-between; padding: 5px 15px; font-weight: bold; font-size: 0.9rem; margin-top: 10px;}
        .story-card { background: #fff; padding: 25px; margin-bottom: 20px; border: 1px solid #ccc; box-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        .story-card h2 { margin: 0 0 10px 0; color: #0c0b82; font-size: 1.6rem; }
    </style>
</head>
<body>

    <div class="newspaper-masthead">
        <h1 class="news-title">Clay County News</h1>
        <div class="news-meta-bar">
            <span>VOL. 1 — NO. 1</span>
            <span id="news-date-display"></span>
            <span>CLAY COUNTY, IL</span>
        </div>
    </div>

    <div style="max-width: 800px; margin: 0 auto; padding: 20px;">
        <div id="full-news-feed">
            <p style="text-align:center;">Scanning local airwaves for Clay County news...</p>
        </div>
    </div>

    <script src="news-engine.js"></script>
    <script>
        document.getElementById('news-date-display').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    </script>
</body>
</html>
