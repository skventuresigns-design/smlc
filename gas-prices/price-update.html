<div id="wp-custom-wrapper">
    <div class="gas-container">
        <div class="gas-column billboard-side">
            <a href="https://staging.supportmylocalcommunity.com/gas-prices/" target="_parent" style="text-decoration: none !important; width: 100%;">
                <div class="billboard-frame">
                    <div class="brand-overlay">S & K Ventures, Inc.</div>
                    <div id="screen" class="digital-screen">
                        <div class="loading-text">SYNCING LATEST DATA...</div>
                    </div>
                    <div class="brand-footer">Today's Local Prices</div>
                </div>
            </a>
        </div>

        <div class="gas-column form-side">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScwPZW27UST8NdOohuUlsBgbue9QKzB4QqDH5-9gpwUy15bnw/viewform?embedded=true" width="100%" height="800" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>
    </div>
</div>

<style>
    /* Responsive Wrapper */
    #wp-custom-wrapper {
        width: 90% !important;
        margin: 20px auto;
        background: transparent !important;
        color-scheme: only light;
    }

    .gas-container {
        display: flex;
        flex-wrap: wrap; /* Allows stacking on mobile */
        gap: 20px;
        align-items: flex-start;
        justify-content: center;
    }

    /* Column Control */
    .gas-column {
        flex: 1 1 400px; /* Grow to fill, but base at 400px */
        max-width: 100%;
    }

    /* Billboard Styling */
    .billboard-frame {
        background: #111;
        border: 4px solid #2a2a2a;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        overflow: hidden;
    }

    .brand-overlay, .brand-footer {
        background: #3e0100;
        color: #ffc929;
        font-weight: bold;
        text-align: center;
        font-size: clamp(10px, 2.5vw, 13px);
        padding: 8px 0;
        letter-spacing: 1px;
        text-transform: uppercase;
        border-bottom: 2px solid #ffc929;
    }
    .brand-footer { border-bottom: none; border-top: 2px solid #ffc929; }

    .digital-screen {
        background: #000;
        margin: 4px;
        min-height: 220px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
    }

    .gas-slide {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
        padding: 10px;
    }

    .station-logo {
        max-height: 60px;
        max-width: 80%;
        object-fit: contain;
        margin-bottom: 10px;
    }

    .price-box { display: flex; align-items: center; justify-content: center; width: 100%; }
    .separator { color: #ffc929; font-size: 2rem; margin: 0 15px; }
    .led-red { color: #ff3b3b; text-shadow: 0 0 8px #ff0000; font-family: monospace; font-size: 2.5rem; line-height: 1; }
    .led-grn { color: #39ff14; text-shadow: 0 0 8px #228b22; font-family: monospace; font-size: 2.5rem; line-height: 1; }
    .update-tag { color: #ffc929; font-size: 9px; margin-top: 10px; opacity: 0.8; }
    .loading-text { color: #ffc929; font-family: monospace; }

    /* Mobile Height Adjustments */
    @media (max-width: 600px) {
        .form-side iframe { height: 600px; }
        .digital-screen { min-height: 180px; }
    }
</style>

<script>
(function() {
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQDrmLrRHDodVlC3wWrQvGbPBEA4K351CmsBP3iF9RVdvdMKMQ2XdQb_cDKfDKvQ_hSuC-EsFidueX6/pub?output=csv';
    const imgBase = 'https://raw.githubusercontent.com/KFruti88/Clay-County-Fuel/main/images/';

    const stations = [
        { id: "48100", display: "Flora", logo: "flora-caseys.png", name: "Casey's" },
        { id: "48101", display: "Flora", logo: "hucks.png", name: "Huck's" },
        { id: "128128", display: "Flora", logo: "mach1.png", name: "Mach 1" },
        { id: "120226", display: "Flora", logo: "faststop.png", name: "Fast Stop" },
        { id: "87817", display: "Louisville", logo: "louisville-caseys.png", name: "Casey's" },
        { id: "171711", display: "Xenia", logo: "knapp.png", name: "Knapp's" },
        { id: "48026", display: "Clay City", logo: "clay-city-caseys.png", name: "Casey's" }
    ];

    async function updateBillboard() {
        try {
            const res = await fetch(sheetUrl + '&v=' + new Date().getTime());
            const csv = await res.text();
            const lines = csv.split(/\r?\n/).map(l => l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
            const dataRows = lines.slice(1).reverse(); // Get latest timestamps first

            let dataMap = {};
            dataRows.forEach(row => {
                if (!row[2]) return;
                const cellText = row[2].toString().toUpperCase();
                stations.forEach(s => {
                    if (!dataMap[s.id] && cellText.includes(s.id)) {
                        dataMap[s.id] = { 
                            reg: (row[3] || "---").replace(/[ "$]/g, ""), 
                            dsl: (row[4] || "---").replace(/[ "$|]/g, ""), 
                            ts: row[0] 
                        };
                    }
                });
            });

            const screen = document.getElementById('screen');
            if(!screen) return;
            screen.innerHTML = '';

            stations.forEach(s => {
                const info = dataMap[s.id] || { reg: "---", dsl: "---", ts: "Awaiting Update" };
                const slide = document.createElement('div');
                slide.className = 'gas-slide';
                slide.innerHTML = `
                    <div style="color:#777; font-size:10px; margin-bottom:4px;">${s.display.toUpperCase()} - ${s.name.toUpperCase()}</div>
                    <img src="${imgBase}${s.logo}" class="station-logo" onerror="this.style.opacity='0'">
                    <div class="price-box">
                        <div style="text-align:center"><span style="color:#888; font-size:8px; display:block;">REGULAR</span><span class="led-red">${info.reg}</span></div>
                        <span class="separator">|</span>
                        <div style="text-align:center"><span style="color:#888; font-size:8px; display:block;">DIESEL</span><span class="led-grn">${info.dsl}</span></div>
                    </div>
                    <div class="update-tag">Updated: ${info.ts}</div>
                `;
                screen.appendChild(slide);
            });

            let current = 0;
            const slides = screen.querySelectorAll('.gas-slide');
            if (slides.length > 0) {
                const rotate = () => {
                    slides.forEach((sl, i) => sl.style.opacity = (i === current ? '1' : '0'));
                    current = (current + 1) % slides.length;
                };
                rotate();
                setInterval(rotate, 6000);
            }
        } catch (e) { console.error("Sync Error", e); }
    }

    if (document.readyState === 'complete') { updateBillboard(); } 
    else { window.addEventListener('load', updateBillboard); }
})();
</script>
