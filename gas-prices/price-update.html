<div id="wp-custom-wrapper">
    <style>
        #wp-custom-wrapper { width: 90%; margin: 20px auto; font-family: sans-serif; }
        #wp-custom-wrapper .admin-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; border-left: 6px solid #3e0100; position: relative; }
        #wp-custom-wrapper h2 { color: #3e0100; text-align: center; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        #wp-custom-wrapper label { display: block; font-size: 11px; color: #777; font-weight: bold; margin-top: 12px; text-transform: uppercase; }
        #wp-custom-wrapper input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        #wp-custom-wrapper .update-btn { background: #ffc929; border: none; padding: 14px; width: 100%; margin-top: 20px; border-radius: 4px; font-weight: bold; color: #3e0100; cursor: pointer; transition: 0.3s; font-size: 14px; }
        #wp-custom-wrapper .update-btn:hover { background: #e0b124; }
        #wp-custom-wrapper .status-area { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 12px; }
        #wp-custom-wrapper .dot { height: 8px; width: 8px; background: #bbb; border-radius: 50%; margin-right: 8px; display: inline-block; }
        #wp-custom-wrapper .synced .dot { background: #39ff14; box-shadow: 0 0 8px #39ff14; }
    </style>

    <h2>Community Fuel Price Updates</h2>
    <div id="community-container"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
(function() {
    const firebaseConfig = {
        apiKey: "AIzaSyBYPbGWDNPUmCSnFWDPPWtiXe2F6MPinXg",
        authDomain: "smlc-fuel-monitor.firebaseapp.com",
        databaseURL: "https://smlc-fuel-monitor-default-rtdb.firebaseio.com",
        projectId: "smlc-fuel-monitor",
        storageBucket: "smlc-fuel-monitor.firebasestorage.app",
        messagingSenderId: "22397440085",
        appId: "1:22397440085:web:c88e71688ed58896bc4dc"
    };

    const communityApp = firebase.initializeApp(firebaseConfig, 'SMLCCommunityApp');
    const db = communityApp.database();

    const stations = [
        { id: "48100", name: "Flora - Casey's" },
        { id: "48101", name: "Flora - Huck's" },
        { id: "128128", name: "Flora - Mach 1" },
        { id: "120226", name: "Flora - Fast Stop" },
        { id: "48026", name: "Louisville - Casey's" },
        { id: "87817", name: "Xenia - Knapp's" },
        { id: "171711", name: "Clay City - Casey's" }
    ];

    const container = document.getElementById('community-container');

    stations.forEach(s => {
        const card = document.createElement('div');
        card.className = 'admin-card';
        card.innerHTML = `
            <strong>${s.name}</strong>
            <label>Regular Price</label><input type="text" id="reg-${s.id}">
            <label>Diesel Price</label><input type="text" id="dsl-${s.id}">
            <label>Last Known Update</label><input type="text" id="date-${s.id}" readonly style="background:#eee">
            <div class="status-area" id="area-${s.id}"><span class="dot"></span> <span id="msg-${s.id}">Ready</span></div>
            <button class="update-btn" id="btn-${s.id}">Submit Price Update</button>
        `;
        container.appendChild(card);

        // This pulls the existing data from Firebase (including the time)
        db.ref('fuel_prices/' + s.id).on('value', snap => {
            const data = snap.val();
            if(data) {
                document.getElementById(`reg-${s.id}`).value = data.reg;
                document.getElementById(`dsl-${s.id}`).value = data.dsl;
                document.getElementById(`date-${s.id}`).value = data.date;
                document.getElementById(`area-${s.id}`).classList.add('synced');
            }
        });

        // This creates and sends the Date + Time when you hit the button
        document.getElementById(`btn-${s.id}`).onclick = function() {
            const reg = document.getElementById(`reg-${s.id}`).value;
            const dsl = document.getElementById(`dsl-${s.id}`).value;
            const msg = document.getElementById(`msg-${s.id}`);

            // GENERATE TIME HERE
            const now = new Date();
            const timestamp = now.toLocaleDateString() + " @ " + 
                              now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + " CST";

            msg.innerText = "Sending Update...";

            db.ref('fuel_prices/' + s.id).update({ reg, dsl, date: timestamp })
                .then(() => { 
                    msg.innerText = "Accepted: " + timestamp; 
                })
                .catch(err => { msg.innerText = "Error!"; console.error(err); });
        };
    });
})();
</script>
