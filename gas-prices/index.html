<div id="wp-custom-wrapper">
    <a href="https://staging.supportmylocalcommunity.com/gas-prices/" target="_parent" style="text-decoration: none !important; width: 100%;">
        <div class="billboard-frame">
            <div class="brand-overlay">S & K Ventures, Inc.</div>
            <div id="screen" class="digital-screen">
                <div class="loading-text">FETCHING LATEST PRICES...</div>
            </div>
            <div class="brand-footer">Today's Local Prices</div>
        </div>
    </a>
</div>

<style>
    #wp-custom-wrapper { 
        background: transparent !important; 
        display: flex; 
        justify-content: center; 
        width: 90% !important; 
        max-width: 500px;
        margin: 10px auto;
    }
    .billboard-frame { 
        background: #111; 
        border: 4px solid #2a2a2a; 
        border-radius: 8px; 
        width: 100%; 
        display: flex; 
        flex-direction: column; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        overflow: hidden;
    }
    .brand-overlay, .brand-footer { 
        background: #3e0100; 
        color: #ffc929; 
        font-weight: bold; 
        text-align: center; 
        font-size: clamp(10px, 2.5vw, 13px); 
        padding: 6px 0;
        letter-spacing: 1px;
        flex: 0 1 auto;
        text-transform: uppercase;
    }
    .brand-overlay { border-bottom: 2px solid #ffc929; }
    .brand-footer { border-top: 2px solid #ffc929; }
    .digital-screen { 
        background: #000; 
        margin: 4px;
        min-height: 200px;
        flex: 1 1 auto; 
        position: relative; 
        overflow: hidden; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        border-radius: 4px;
    }
    .gas-slide { 
        position: absolute; 
        inset: 0;
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        opacity: 0; 
        transition: opacity 0.8s ease-in-out;
        padding: 10px;
    }
    .station-logo { 
        max-height: clamp(40px, 10vh, 65px); 
        max-width: 85%; 
        object-fit: contain;
        margin-bottom: 10px; 
    }
    .price-box { display: flex; align-items: center; justify-content: center; width: 100%; }
    .separator { color: #ffc929; font-size: 2rem; margin: 0 15px; }
    .led-red { color: #ff3b3b; text-shadow: 0 0 8px #ff0000; font-family: monospace; font-size: clamp(1.6rem, 6vw, 2.5rem); line-height: 1; }
    .led-grn { color: #39ff14; text-shadow: 0 0 8px #228b22; font-family: monospace; font-size: clamp(1.6rem, 6vw, 2.5rem); line-height: 1; }
    .update-tag { color: #ffc929; font-size: 9px; margin-top: 12px; opacity: 0.8; background: rgba(0,0,0,0.4); padding: 2px 5px; border-radius: 2px;}
</style>

<script>
(function() {
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQDrmLrRHDodVlC3wWrQvGbPBEA4K351CmsBP3iF9RVdvdMKMQ2XdQb_cDKfDKvQ_hSuC-EsFidueX6/pub?output=csv';
    const imgBase = 'https://raw.githubusercontent.com/KFruti88/Clay-County-Fuel/main/images/';

    const stations = [
        { id: "48100", display: "Flora", logo: "flora-caseys.png", name: "Casey's" },
        { id: "48101", display: "Flora", logo: "hucks.png", name: "Huck's" },
        { id: "128128", display: "Flora", logo: "mach1.png", name: "Mach 1" },
        { id: "120226", display: "Flora", logo: "faststop.png", name: "Fast Stop" },
        { id: "87817", display: "Louisville", logo: "louisville-caseys.png", name: "Casey's" }, 
        { id: "171711", display: "Xenia", logo: "knapp.png", name: "Knapp's" },
        { id: "48026", display: "Clay City", logo: "clay-city-caseys.png", name: "Casey's" } 
    ];

    async function initBillboard() {
        try {
            const res = await fetch(sheetUrl + '&v=' + new Date().getTime());
            const csv = await res.text();
            
            // Parse CSV and reverse lines to check newest entries first
            const lines = csv.split(/\r?\n/).map(l => l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
            const dataRows = lines.slice(1).reverse(); // Reverse so newest timestamps are at the top

            let dataMap = {};
            dataRows.forEach(row => {
                if (!row[2]) return;
                const cellText = row[2].toString().toUpperCase();
                
                stations.forEach(s => {
                    // Only assign if we haven't found a newer entry for this ID yet
                    if (!dataMap[s.id] && cellText.includes(s.id)) {
                        dataMap[s.id] = { 
                            reg: (row[3] || "---").replace(/[ "$]/g, ""), 
                            dsl: (row[4] || "---").replace(/[ "$|]/g, ""), 
                            ts: row[0] 
                        };
                    }
                });
            });

            const screen = document.getElementById('screen');
            if(!screen) return;
            screen.innerHTML = '';

            stations.forEach(s => {
                const info = dataMap[s.id] || { reg: "---", dsl: "---", ts: "Awaiting Update" };
                const slide = document.createElement('div');
                slide.className = 'gas-slide';
                slide.innerHTML = `
                    <div style="color:#777; font-size:10px; margin-bottom:4px; letter-spacing:1px;">${s.display.toUpperCase()} - ${s.name.toUpperCase()}</div>
                    <img src="${imgBase}${s.logo}" class="station-logo">
                    <div class="price-box">
                        <div style="text-align:center"><span style="color:#888; font-size:8px; display:block;">REGULAR</span><span class="led-red">${info.reg}</span></div>
                        <span class="separator">|</span>
                        <div style="text-align:center"><span style="color:#888; font-size:8px; display:block;">DIESEL</span><span class="led-grn">${info.dsl}</span></div>
                    </div>
                    <div class="update-tag">Updated: ${info.ts}</div>
                `;
                screen.appendChild(slide);
            });

            let current = 0;
            const slides = screen.querySelectorAll('.gas-slide');
            if (slides.length > 0) {
                const rotate = () => {
                    slides.forEach((sl, i) => sl.style.opacity = (i === current ? '1' : '0'));
                    current = (current + 1) % slides.length;
                };
                rotate();
                setInterval(rotate, 6000);
            }
        } catch (e) { console.error("Update Sync Error", e); }
    }

    if (document.readyState === 'complete') { initBillboard(); } 
    else { window.addEventListener('load', initBillboard); }
})();
</script>
