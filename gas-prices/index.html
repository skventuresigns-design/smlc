<div id="wp-custom-wrapper">
    <div class="gas-container">
        <div class="gas-column billboard-side">
            <a href="https://staging.supportmylocalcommunity.com/gas-prices/" target="_parent" style="text-decoration: none !important; width: 100%;">
                <div class="billboard-frame">
                    <div class="brand-overlay">S & K Ventures, Inc.</div>
                    <div id="screen" class="digital-screen">
                        <div class="loading-text">RECALIBRATING SENSORS...</div>
                    </div>
                    <div class="brand-footer">Click Here to Update Price</div>
                </div>
            </a>
        </div>

        <div class="gas-column form-side">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScwPZW27UST8NdOohuUlsBgbue9QKzB4QqDH5-9gpwUy15bnw/viewform?embedded=true" width="100%" height="1100" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
        </div>
    </div>
</div>

<style>
    #wp-custom-wrapper {
        width: 90% !important;
        margin: 10px auto;
        background: transparent !important;
    }

    .gas-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .gas-column {
        flex: 1 1 350px;
        max-width: 500px;
    }

    .billboard-frame {
        background: #111;
        border: 4px solid #2a2a2a;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        overflow: hidden;
        transition: transform 0.2s ease;
    }
    
    /* Subtle hover effect to show it's clickable */
    .billboard-frame:hover {
        transform: scale(1.01);
        border-color: #ffc929;
    }

    .brand-overlay, .brand-footer {
        background: #3e0100;
        color: #ffc929;
        font-weight: bold;
        text-align: center;
        font-size: clamp(11px, 2.5vw, 14px);
        padding: 10px 0;
        text-transform: uppercase;
        border-bottom: 2px solid #ffc929;
    }
    .brand-footer { border-bottom: none; border-top: 2px solid #ffc929; cursor: pointer; }

    .digital-screen {
        background: #000;
        margin: 4px;
        min-height: 220px;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
    }

    .gas-slide {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
    }

    .station-logo {
        max-height: 60px;
        max-width: 80%;
        object-fit: contain;
        margin-bottom: 10px;
    }

    .price-box { display: flex; align-items: center; justify-content: center; width: 100%; }
    .separator { color: #ffc929; font-size: 2rem; margin: 0 15px; }
    .led-red { color: #ff3b3b; text-shadow: 0 0 8px #ff0000; font-family: monospace; font-size: 2.5rem; }
    .led-grn { color: #39ff14; text-shadow: 0 0 8px #228b22; font-family: monospace; font-size: 2.5rem; }
    .update-tag { color: #ffc929; font-size: 9px; margin-top: 10px; opacity: 0.7; }
    .loading-text { color: #ffc929; font-family: monospace; }
</style>

<script>
(function() {
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQDrmLrRHDodVlC3wWrQvGbPBEA4K351CmsBP3iF9RVdvdMKMQ2XdQb_cDKfDKvQ_hSuC-EsFidueX6/pub?output=csv';
    const imgBase = 'https://raw.githubusercontent.com/KFruti88/Clay-County-Fuel/main/images/';

    const stations = [
        { id: "48100", display: "Flora", logo: "flora-caseys.png", name: "Casey's" },
        { id: "48101", display: "Flora", logo: "hucks.png", name: "Huck's" },
        { id: "128128", display: "Flora", logo: "mach1.png", name: "Mach 1" },
        { id: "120226", display: "Flora", logo: "faststop.png", name: "Fast Stop" },
        { id: "87817", display: "Louisville", logo: "louisville-caseys.png", name: "Casey's" },
        { id: "171711", display: "Xenia", logo: "knapp.png", name: "Knapp's" },
        { id: "48026", display: "Clay City", logo: "clay-city-caseys.png", name: "Casey's" }
    ];

    async function fetchData() {
        try {
            const response = await fetch(`${sheetUrl}&v=${Date.now()}`);
            const data = await response.text();
            const rows = data.split(/\r?\n/).map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
            const sortedRows = rows.slice(1).reverse(); 

            let latestPrices = {};
            sortedRows.forEach(row => {
                const stationCell = (row[2] || "").toString().toUpperCase();
                stations.forEach(s => {
                    if (!latestPrices[s.id] && stationCell.includes(s.id)) {
                        latestPrices[s.id] = {
                            reg: (row[3] || "---").replace(/[ "$]/g, ""),
                            dsl: (row[4] || "---").replace(/[ "$|]/g, ""),
                            ts: row[0]
                        };
                    }
                });
            });
            renderBillboard(latestPrices);
        } catch (e) { console.error("Update failed", e); }
    }

    function renderBillboard(data) {
        const screen = document.getElementById('screen');
        if(!screen) return;
        screen.innerHTML = '';

        stations.forEach(s => {
            const info = data[s.id] || { reg: "---", dsl: "---", ts: "Awaiting Sync" };
            const slide = document.createElement('div');
            slide.className = 'gas-slide';
            slide.innerHTML = `
                <div style="color:#777; font-size:10px; margin-bottom:4px;">${s.display.toUpperCase()} - ${s.name.toUpperCase()}</div>
                <img src="${imgBase}${s.logo}" class="station-logo" onerror="this.style.opacity='0'">
                <div class="price-box">
                    <div style="text-align:center"><span style="color:#888; font-size:8px; display:block;">REGULAR</span><span class="led-red">${info.reg}</span></div>
                    <span class="separator">|</span>
                    <div style="text-align:center"><span style="color:#888; font-size:8px; display:block;">DIESEL</span><span class="led-grn">${info.dsl}</span></div>
                </div>
                <div class="update-tag">Updated: ${info.ts}</div>
            `;
            screen.appendChild(slide);
        });

        let current = 0;
        const slides = screen.querySelectorAll('.gas-slide');
        const rotate = () => {
            slides.forEach((sl, i) => sl.style.opacity = (i === current ? '1' : '0'));
            current = (current + 1) % slides.length;
        };
        rotate();
        setInterval(rotate, 6000);
    }

    fetchData();
})();
</script>
