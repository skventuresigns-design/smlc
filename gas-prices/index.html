<div id="wp-custom-wrapper">
    <style>
        #wp-custom-wrapper { width: 90%; margin: 0 auto; display: flex; justify-content: center; align-items: center; background: transparent; }
        #wp-custom-wrapper .billboard-link { text-decoration: none; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; }
        #wp-custom-wrapper .billboard-frame { background: #111; border: 8px solid #2a2a2a; border-radius: 4px; padding: 10px; position: relative; width: 100%; max-width: 500px; aspect-ratio: 16 / 11; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        #wp-custom-wrapper .brand-overlay { position: absolute; top: 0; width: 100%; background: #3e0100; color: #ffc929; font-weight: bold; text-align: center; font-size: 14px; padding: 8px 0; border-bottom: 2px solid #ffc929; z-index: 10; letter-spacing: 1px; }
        #wp-custom-wrapper .brand-footer { position: absolute; bottom: 0; width: 100%; background: #3e0100; color: #ffc929; font-weight: bold; text-align: center; font-size: 14px; padding: 8px 0; border-top: 2px solid #ffc929; z-index: 10; letter-spacing: 0.5px; }
        #wp-custom-wrapper .digital-screen { width: 95%; height: 70%; background: #000; border-radius: 5px; position: relative; overflow: hidden; border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
        #wp-custom-wrapper .gas-slide { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 1s ease-in-out; }
        
        #wp-custom-wrapper .town-header { color: #ffc929; font-size: 12px; font-weight: bold; letter-spacing: 3px; margin-bottom: 10px; text-shadow: 0 0 5px rgba(255, 201, 41, 0.6); }
        #wp-custom-wrapper .logo-container { height: 25%; width: 70%; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        #wp-custom-wrapper .station-logo { max-height: 100%; max-width: 100%; }
        #wp-custom-wrapper .logo-fallback { color: #fff; font-size: 24px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; border: 2px solid #444; padding: 5px 15px; }

        #wp-custom-wrapper .price-row { width: 75%; display: flex; justify-content: space-between; align-items: center; margin: 3px 0; }
        #wp-custom-wrapper .price-label { color: #ffc929; font-size: 11px; font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 5px rgba(255, 201, 41, 0.4); }
        #wp-custom-wrapper .led-red { color: #ff3b3b; text-shadow: 0 0 10px #ff0000; font-family: monospace; font-size: 2.2rem; font-weight: bold; }
        #wp-custom-wrapper .led-grn { color: #39ff14; text-shadow: 0 0 10px #228b22; font-family: monospace; font-size: 2.2rem; font-weight: bold; }
        
        /* Expanded Update Tag for Date + Time */
        #wp-custom-wrapper .update-tag { color: #ffc929; font-size: 9px; margin-top: 8px; font-weight: 600; text-shadow: 0 0 5px rgba(255, 201, 41, 0.4); text-transform: uppercase; }

        @media (max-width: 600px) {
            #wp-custom-wrapper .billboard-frame { aspect-ratio: 1 / 1; }
            #wp-custom-wrapper .led-red, #wp-custom-wrapper .led-grn { font-size: 1.8rem; }
        }
    </style>

    <a href="https://supportmylocalcommunity.com/gas-prices/" target="_parent" class="billboard-link">
        <div class="billboard-frame">
            <div class="brand-overlay">S & K Ventures, Inc. • Digital Advertising</div>
            <div id="fuel-screen" class="digital-screen">
                <div style="color: #ffc929; font-weight: bold;">Loading Prices...</div>
            </div>
            <div class="brand-footer">Click billboard to update prices</div>
        </div>
    </a>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
(function() {
    const firebaseConfig = {
        apiKey: "AIzaSyBYPbGWDNPUmCSnFWDPPWtiXe2F6MPinXg",
        authDomain: "smlc-fuel-monitor.firebaseapp.com",
        databaseURL: "https://smlc-fuel-monitor-default-rtdb.firebaseio.com",
        projectId: "smlc-fuel-monitor",
        storageBucket: "smlc-fuel-monitor.firebasestorage.app",
        messagingSenderId: "22397440085",
        appId: "1:22397440085:web:c88e71688ed58896bc4dc"
    };

    const fuelApp = firebase.initializeApp(firebaseConfig, 'SMLCFuelBillboard');
    const db = fuelApp.database();

    const stationConfigs = {
        "48100": { town: "flora", display: "Flora", name: "CASEY'S", logo: "Casey's.png" },     
        "48101": { town: "flora", display: "Flora", name: "HUCK'S", logo: "Hucks.png" },      
        "128128": { town: "flora", display: "Flora", name: "MACH 1", logo: "Mach 1.png" },    
        "120226": { town: "flora", display: "Flora", name: "FAST STOP", logo: "Fast stop.png" },  
        "48026": { town: "louisville", display: "Louisville", name: "CASEY'S", logo: "Casey's.png" }, 
        "87817": { town: "xenia", display: "Xenia", name: "KNAPP'S", logo: "Knapps.png" },      
        "171711": { town: "clay-city", display: "Clay City", name: "CASEY'S", logo: "Casey's.png" }  
    };

    const urlParams = new URLSearchParams(window.location.search);
    const targetTown = urlParams.get('town')?.toLowerCase();
    const screen = document.getElementById('fuel-screen');
    let currentSlide = 0;

    function render(data) {
        screen.innerHTML = '';
        const ids = Object.keys(stationConfigs).filter(id => !targetTown || stationConfigs[id].town === targetTown);
        
        ids.forEach(id => {
            const config = stationConfigs[id];
            const info = data[id] || { reg: "---", dsl: "---", date: "PENDING" };
            const safeLogo = encodeURIComponent(config.logo);
            
            const slide = document.createElement('div');
            slide.className = 'gas-slide';
            slide.innerHTML = `
                <div class="town-header">${config.display.toUpperCase()}, IL</div>
                <div class="logo-container">
                    <img src="https://raw.githubusercontent.com/skventuresigns-design/smlc/main/gas-prices/image/${safeLogo}" 
                         class="station-logo" 
                         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div class="logo-fallback" style="display:none;">${config.name}</div>
                </div>
                <div class="price-row"><span class="price-label">REGULAR</span><span class="led-red">${info.reg}</span></div>
                <div class="price-row"><span class="price-label">DIESEL</span><span class="led-grn">${info.dsl === "0" ? "---" : info.dsl}</span></div>
                <div class="update-tag">UPDATED: ${info.date}</div>
            `;
            screen.appendChild(slide);
        });

        const slides = screen.querySelectorAll('.gas-slide');
        function cycle() {
            if(slides.length === 0) return;
            slides.forEach((s, i) => s.style.opacity = (i === currentSlide) ? "1" : "0");
            currentSlide = (currentSlide + 1) % slides.length;
        }

        if (slides.length > 0) {
            cycle();
            if (window.fuelRotator) clearInterval(window.fuelRotator);
            window.fuelRotator = setInterval(cycle, 6000);
        }
    }

    db.ref('fuel_prices').on('value', (snap) => {
        const val = snap.val();
        if (val) render(val);
        else screen.innerHTML = '<div style="color: #ffc929; font-weight: bold;">No Data Found</div>';
    });
})();
</script>
