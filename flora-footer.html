<script src="https://elfsightcdn.com/platform.js" async></script>
<div class="elfsight-app-d65d99f2-6e18-41a9-8b77-2639002c8d36" data-elfsight-app-lazy></div>

<style>
    /* Sticky Wrapper - Forced to top for Divi compatibility */
    .sticky-top-wrap {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 9999999 !important; 
        box-shadow: 0 2px 15px rgba(0,0,0,0.2);
        background: #ffffff;
    }

    /* News Ticker Bar - Slim Red background, White text */
    #news-ticker-container {
        background: #cc0000; 
        color: #ffffff; 
        overflow: hidden;
        white-space: nowrap;
        padding: 4px 0; /* Slim bar setting */
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 18px; /* Desktop font size */
        display: block !important; 
        border-bottom: 1px solid rgba(255,255,255,0.2);
        min-height: auto;
        line-height: 1.2;
    }

    .ticker-wrapper {
        display: inline-block;
        padding-left: 100%;
        animation: ticker-scroll 60s linear infinite;
        will-change: transform;
    }

    #news-ticker-container:hover .ticker-wrapper {
        animation-play-state: paused;
    }

    .ticker-item {
        display: inline-block;
        padding: 0 60px;
        font-size: 18px; 
        vertical-align: middle;
    }

    .ticker-item a {
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
    }

    .ticker-item a:hover {
        text-decoration: underline;
    }

    /* Game Alerts - Yellow high-contrast text */
    .game-alert {
        color: #ffeb3b !important; 
        text-transform: uppercase;
        font-weight: 800;
    }

    @keyframes ticker-scroll {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-100%, 0, 0); }
    }

    /* ScoreStream Area - Clean White background */
    .sports-ticker-wrap {
        background: #ffffff; 
        width: 100%;
        min-height: 40px;
        border-bottom: 1px solid #eeeeee;
        overflow: hidden;
    }

    /* Mobile Adjustments (Divi 14px Preference) */
    @media (max-width: 768px) {
        #news-ticker-container {
            font-size: 14px !important; 
            padding: 4px 0;
        }
        .ticker-wrapper {
            animation: ticker-scroll 45s linear infinite;
        }
        .ticker-item, .ticker-item a, .game-alert {
            font-size: 14px !important; 
        }
    }
</style>

<div class="sticky-top-wrap" id="flora-sticky-bar">
    <!-- News Ticker Area -->
    <div id="news-ticker-container">
        <div class="ticker-wrapper" id="ticker-content">
            <span class="ticker-item">Loading Flora updates...</span>
        </div>
    </div>

    <!-- ScoreStream Scoreboard (Flora Wolves ID: 68602) -->
    <div class="sports-ticker-wrap">
        <div class="scorestream-widget-container" data-ss_widget_type="horzScoreboard" data-user-widget-id="68602"></div>
        <script async="async" type="text/javascript" src="https://scorestream.com/apiJsCdn/widgets/embed.js"></script>
    </div>
</div>

<script>
(function() {
    const RSS_URL = 'https://www.google.com/alerts/feeds/16385066500020016213/3177914264312887151';
    const TEAM_URL = 'https://scorestream.com/team/flora-high-school-wolves-5114/games';
    const PROXY_URL = 'https://api.allorigins.win/get?url=';

    async function fetchGameStatus() {
        try {
            const response = await fetch(`${PROXY_URL}${encodeURIComponent(TEAM_URL)}`);
            if (!response.ok) return null;
            const data = await response.json();
            const bodyText = data.contents;
            if (bodyText.includes("Flora") && (bodyText.includes("Live") || bodyText.includes("Qtr") || bodyText.includes("Half"))) {
                return "🔥 LIVE: Wolves Game in Progress! Click for scores";
            }
            return null;
        } catch (e) { return null; }
    }

    async function initFloraBar() {
        const container = document.getElementById('news-ticker-container');
        const content = document.getElementById('ticker-content');
        const barWrapper = document.getElementById('flora-sticky-bar');
        
        let gameHtml = '';
        const liveStatus = await fetchGameStatus();
        
        if (liveStatus) {
            gameHtml = `<span class="ticker-item game-alert"><a href="${TEAM_URL}" target="_blank">${liveStatus}</a></span>`;
        } else {
            const now = new Date();
            const local = new Date(now.toLocaleString("en-US", {timeZone: "America/Chicago"}));
            const hours = local.getHours();
            const mins = local.getMinutes();
            if (hours < 17 || (hours === 17 && mins < 30)) {
                gameHtml = `<span class="ticker-item game-alert"><a href="${TEAM_URL}" target="_blank">🚨 TONIGHT: Wolves Game at 5:30 PM!</a></span>`;
            } else {
                gameHtml = `<span class="ticker-item game-alert"><a href="${TEAM_URL}" target="_blank">🔥 LIVE: Wolves Game in Progress! See Below</a></span>`;
            }
        }

        const chicagoDate = new Intl.DateTimeFormat('en-CA', {timeZone: 'America/Chicago'}).format(new Date());

        try {
            const response = await fetch(`${PROXY_URL}${encodeURIComponent(RSS_URL)}`);
            const data = await response.json();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(data.contents, "text/xml");
            const entries = xmlDoc.getElementsByTagName("entry");
            const newsItems = [];

            for (let i = 0; i < entries.length; i++) {
                const dateNode = entries[i].getElementsByTagName("updated")[0] || entries[i].getElementsByTagName("published")[0];
                if (dateNode && dateNode.textContent.split('T')[0] === chicagoDate) {
                    const title = entries[i].getElementsByTagName("title")[0].textContent.replace(/<\/?[^>]+(>|$)/g, ""); 
                    const link = entries[i].getElementsByTagName("link")[0].getAttribute("href");
                    newsItems.push(`<span class="ticker-item"><a href="${link}" target="_blank">NEWS: ${title}</a></span>`);
                }
            }

            let interleavedHtml = '';
            if (newsItems.length > 0) {
                newsItems.forEach(news => interleavedHtml += gameHtml + news);
            } else {
                interleavedHtml = gameHtml + gameHtml + gameHtml;
            }

            content.innerHTML = interleavedHtml + interleavedHtml;
            
            const adjustLayout = () => {
                const height = barWrapper.offsetHeight;
                if (height > 0) {
                    document.body.style.transition = "padding-top 0.4s ease";
                    document.body.style.paddingTop = height + "px";
                }
            };

            adjustLayout();
            window.addEventListener('resize', adjustLayout);
            setTimeout(adjustLayout, 1500);
            setTimeout(adjustLayout, 4000);

        } catch (error) {
            content.innerHTML = gameHtml + gameHtml + gameHtml;
            document.body.style.paddingTop = "100px";
        }
    }

    if (document.readyState === 'complete') {
        initFloraBar();
    } else {
        window.addEventListener('load', initFloraBar);
    }
})();
</script>
